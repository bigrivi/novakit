name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run pytest -q --cov=novakit --cov-report=term-missing
      - name: Lint
        run: uv run ruff check novakit tests
      - name: Type check
        run: uv run mypy

  package:
    name: Wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: uv sync --locked --extra dev
      - name: Build and smoke-test wheel
        run: bash scripts/smoke_wheel.sh
