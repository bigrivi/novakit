site_name: novakit
site_url: https://bigrivi.github.io/novakit/
site_author: bigrivi
site_description: Embeddable Python runtime for LLM agents, tools, events, and conversations.
repo_url: https://github.com/bigrivi/novakit
repo_name: GitHub
use_directory_urls: true

theme:
  name: material
  language: en

plugins:
  - search
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          site_name: novakit
          site_description: Embeddable Python runtime for LLM agents, tools, events, and conversations.
        - locale: zh
          name: 简体中文
          site_name: novakit 文档
          site_description: 可嵌入的 Python 智能体运行时，支持 LLM、工具、事件与对话。
          nav_translations:
            Home: 首页
            Getting Started: 入门
            Installation: 安装
            Quickstart: 快速开始
            Guides: 指南
            Configuration: 配置
            Sessions and persistence: 会话与持久化
            Tools and approvals: 工具与审批
            Compaction: 上下文压缩
            Background tasks: 后台任务
            MCP: MCP
            Project instructions: 项目指令
            Hierarchy and delegation: 层级与委派
            Session fork: 会话分叉
            API Reference: API 参考
            Agent: 智能体
            Tasks: 任务
            Prompt: 提示词
            Utilities: 工具
            Pricing: 价格计算
            Changelog: 更新日志

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - Configuration: guides/configuration.md
      - Sessions and persistence: guides/sessions.md
      - Tools and approvals: guides/tools-and-approvals.md
      - Compaction: guides/compaction.md
      - Background tasks: guides/background-tasks.md
      - MCP: guides/mcp.md
      - Project instructions: guides/project-instructions.md
      - Hierarchy and delegation: guides/hierarchy.md
      - Session fork: guides/session-fork.md
  - API Reference:
      - Agent: reference/agent.md
      - Compaction: reference/compaction.md
      - Tasks: reference/tasks.md
      - MCP: reference/mcp.md
      - Prompt: reference/prompt.md
      - Utilities: reference/utilities.md
      - Pricing: reference/pricing.md
  - Changelog: changelog.md
