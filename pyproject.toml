[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "novakit"
version = "0.1.0"
description = "Embeddable Python runtime for LLM agents, tools, events, and conversations."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "bigrivi" }]
keywords = ["ai", "ai-agent", "llm", "tools", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp",
    "tiktoken",
]

[project.optional-dependencies]
images = ["pillow"]
mcp = []
dev = [
    "mypy>=1.11",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=6.0",
    "ruff>=0.17.4,<0.18",
]

[project.urls]
Homepage = "https://github.com/bigrivi/novakit"
Repository = "https://github.com/bigrivi/novakit"
Documentation = "https://bigrivi.github.io/novakit/"
Issues = "https://github.com/bigrivi/novakit/issues"
Changelog = "https://github.com/bigrivi/novakit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["novakit*"]

[tool.setuptools.package-data]
novakit = ["py.typed"]

[tool.mypy]
python_version = "3.12"
files = ["novakit"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "DTZ"]
ignore = ["E501", "SIM105", "RUF001", "ASYNC109", "ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.coverage.run]
source = ["novakit"]

[tool.coverage.report]
fail_under = 99
show_missing = true

[dependency-groups]
docs = [
    "mkdocs-material>=9.2,<9.7",
    "mkdocstrings[python]>=1.0.8",
    "mkdocs-static-i18n==1.3.1",
]
